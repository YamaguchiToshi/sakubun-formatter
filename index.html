<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原稿用紙フォーマッター</title>
    <link rel="stylesheet" href="styles.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <button id="theme-toggle" class="theme-toggle-btn no-print" aria-label="Toggle Dark Mode"
        title="ダークモード切替">🌙</button>
    <div class="app-container no-print">
        <main>
            <div class="input-section">
                <textarea id="text-input" placeholder="ここに本文を入力してください。改行も反映されます。" class="text-input"></textarea>
                <div class="controls">
                    <button id="format-btn" class="primary-btn">原稿用紙にフォーマット</button>
                    <button id="print-btn" class="secondary-btn" disabled>印刷・PDF保存</button>
                </div>
            </div>
        </main>
    </div>

    <div id="print-area">
        <!-- ページがここに生成されます -->
    </div>

    <script src="script.js?v=2"></script>
</body>

</html>
